# gcloud builds submit --config cloudbuild.webhook.yaml .
# Needed because `gcloud builds submit --tag <image> .` only auto-detects a
# file literally named "Dockerfile" — this repo now has two.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "Dockerfile.webhook",
        "-t",
        "europe-west2-docker.pkg.dev/project-a6778446-201f-4aa5-a03/radio-comp/webhook:latest",
        ".",
      ]
images:
  - "europe-west2-docker.pkg.dev/project-a6778446-201f-4aa5-a03/radio-comp/webhook:latest"
