<!DOCTYPE html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Win a Radio - Enter Now</title></head>
<body>
  <h1>Win a Retro Radio!</h1>
  <form id="entry-form">
    <div>
      <label for="full-name">Full name</label>
      <input type="text" id="full-name" name="full_name">
    </div>
    <div>
      <label for="email-address">Email address</label>
      <input type="email" id="email-address" name="email">
    </div>
    <div>
      <label for="phone-number">Phone number</label>
      <input type="tel" id="phone-number" name="phone">
    </div>
    <div>
      <label for="dob">Date of birth</label>
      <input type="date" id="dob" name="dob">
    </div>
    <div>
      <label for="postal-address">Postal address</label>
      <input type="text" id="postal-address" name="address">
    </div>
    <div>
      <label>
        <input type="checkbox" id="tandc-checkbox" name="agree_terms">
        I am 18 or over and agree to the competition terms and conditions
      </label>
    </div>
    <div>
      <label>
        <input type="checkbox" id="marketing-checkbox" name="marketing_optin">
        Keep me updated with offers and news from our partners
      </label>
    </div>
    <button type="submit">Enter Competition</button>
  </form>
</body>
</html>
